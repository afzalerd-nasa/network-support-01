<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="72%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#0088ff" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#003e9c" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#021747" stop-opacity="1" />
      <stop offset="100%" stop-color="#010c26" stop-opacity="1" />
    </radialGradient>

    <!-- Deep Ambient Glow -->
    <linearGradient id="linearDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c4c" />
      <stop offset="40%" stop-color="#011b47" />
      <stop offset="100%" stop-color="#000b21" />
    </linearGradient>

    <!-- Globe Gradient & Clip -->
    <radialGradient id="globeSphere" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#08428f" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#032057" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#010e2b" stop-opacity="0.98" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowIntense" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Base Background -->
  <rect width="1920" height="1080" fill="url(#linearDeep)" />
  <rect width="1920" height="1080" fill="url(#bgGlow)" style="mix-blend-mode: screen;" />

  <!-- Background Triangular Constellation Mesh (Left and Center) -->
  <g stroke="#0099ff" stroke-width="0.75" stroke-opacity="0.18" fill="none">
    <polygon points="120,240 380,180 260,420" />
    <polygon points="380,180 640,290 520,490" />
    <polygon points="260,420 520,490 320,680" />
    <polygon points="520,490 780,450 620,720" />
    <polygon points="320,680 620,720 480,920" />
    <polygon points="620,720 890,680 750,960" />
    <polygon points="100,560 260,420 320,680" />
    <polygon points="640,290 920,220 780,450" />
    <polygon points="920,220 1180,310 1020,520" />
    <polygon points="780,450 1020,520 890,680" />
    <polygon points="890,680 1140,690 980,940" />
  </g>

  <!-- Subtle mesh nodes -->
  <g fill="#00d2ff" opacity="0.3">
    <circle cx="380" cy="180" r="3" />
    <circle cx="260" cy="420" r="3.5" />
    <circle cx="640" cy="290" r="4" />
    <circle cx="520" cy="490" r="3" />
    <circle cx="320" cy="680" r="3" />
    <circle cx="780" cy="450" r="4.5" />
    <circle cx="620" cy="720" r="3" />
    <circle cx="890" cy="680" r="4" />
    <circle cx="920" cy="220" r="4" />
    <circle cx="1020" cy="520" r="3.5" />
  </g>

  <!-- Giant Global Network Wireframe on Right Side -->
  <g transform="translate(1520, 540)">
    <!-- Globe Base Sphere Silhouette -->
    <circle cx="0" cy="0" r="540" fill="url(#globeSphere)" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Continents Silhouettes on Globe (Stylized Dark Blue Landmasses) -->
    <g fill="#042766" opacity="0.85">
      <!-- North America & Arctic -->
      <path d="M-360,-220 Q-280,-340 -160,-320 Q-90,-380 40,-340 Q110,-280 80,-190 Q-20,-160 -110,-120 Q-240,-130 -360,-220 Z" />
      <!-- Central & South America -->
      <path d="M-130,-110 Q-60,-80 20,-60 Q80,20 120,160 Q80,320 -10,380 Q-70,330 -90,210 Q-120,60 -130,-110 Z" />
      <!-- Eurasia & Atlantic Arcs -->
      <path d="M120,-320 Q240,-380 380,-310 Q440,-180 340,-60 Q220,-80 180,-190 Z" />
    </g>

    <!-- Longitudinal / Latitudinal Arcs -->
    <ellipse cx="0" cy="0" rx="540" ry="540" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.35" />
    <ellipse cx="0" cy="0" rx="460" ry="540" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="0" cy="0" rx="360" ry="540" fill="none" stroke="#0096c7" stroke-width="1" stroke-opacity="0.25" />
    <ellipse cx="0" cy="0" rx="240" ry="540" fill="none" stroke="#0077b6" stroke-width="0.8" stroke-opacity="0.25" />
    <ellipse cx="0" cy="0" rx="120" ry="540" fill="none" stroke="#0077b6" stroke-width="0.75" stroke-opacity="0.2" />

    <!-- Latitudinal Ellipses -->
    <ellipse cx="0" cy="-280" rx="460" ry="140" fill="none" stroke="#00b4d8" stroke-width="0.8" stroke-opacity="0.3" />
    <ellipse cx="0" cy="-120" rx="520" ry="160" fill="none" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.35" />
    <ellipse cx="0" cy="80" rx="530" ry="160" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="0" cy="260" rx="470" ry="140" fill="none" stroke="#0096c7" stroke-width="0.8" stroke-opacity="0.25" />

    <!-- Interconnected Network Constellation Lines on Globe -->
    <g stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.75" fill="none">
      <line x1="-320" y1="-190" x2="-210" y2="-80" />
      <line x1="-210" y1="-80" x2="-80" y2="-170" />
      <line x1="-80" y1="-170" x2="60" y2="-290" />
      <line x1="-80" y1="-170" x2="40" y2="-80" />
      <line x1="60" y1="-290" x2="180" y2="-210" />
      <line x1="40" y1="-80" x2="180" y2="-210" />
      <line x1="-210" y1="-80" x2="-130" y2="40" />
      <line x1="-130" y1="40" x2="40" y2="-80" />
      <line x1="-130" y1="40" x2="-40" y2="170" />
      <line x1="40" y1="-80" x2="120" y2="90" />
      <line x1="-40" y1="170" x2="120" y2="90" />
      <line x1="180" y1="-210" x2="290" y2="-110" />
      <line x1="120" y1="90" x2="260" y2="180" />
      <line x1="290" y1="-110" x2="260" y2="180" />
      <line x1="-40" y1="170" x2="30" y2="310" />
      <line x1="120" y1="90" x2="30" y2="310" />
      <line x1="30" y1="310" x2="190" y2="340" />
      <line x1="260" y1="180" x2="190" y2="340" />
      
      <!-- Outer Orbiting Connecting Links -->
      <path d="M-320,-190 C-360,-80 -380,40 -340,150" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
      <path d="M-340,150 C-260,280 -140,360 30,310" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
      <line x1="-340" y1="150" x2="-130" y2="40" />
      <line x1="-340" y1="150" x2="-40" y2="170" />
    </g>

    <!-- Glowing Major Hub Nodes with Cyan Halos -->
    <g filter="url(#glowCyan)">
      <circle cx="-320" cy="-190" r="7" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="-210" cy="-80" r="6" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
      <circle cx="-80" cy="-170" r="9" fill="#ffffff" stroke="#38bdf8" stroke-width="3.5" filter="url(#glowIntense)" />
      <circle cx="60" cy="-290" r="6.5" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
      <circle cx="40" cy="-80" r="8" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="180" cy="-210" r="7.5" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="-130" cy="40" r="6.5" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
      <circle cx="-40" cy="170" r="7" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="120" cy="90" r="8.5" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="290" cy="-110" r="7" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
      <circle cx="260" cy="180" r="9.5" fill="#ffffff" stroke="#00e5ff" stroke-width="4" filter="url(#glowIntense)" />
      <circle cx="30" cy="310" r="7" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
      <circle cx="190" cy="340" r="6" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
      <circle cx="-340" cy="150" r="8" fill="#ffffff" stroke="#00e5ff" stroke-width="3" />
    </g>

    <!-- Secondary Small Connection Nodes -->
    <g fill="#67e8f9" opacity="0.85">
      <circle cx="-160" cy="-220" r="3.5" />
      <circle cx="-10" cy="-210" r="4" />
      <circle cx="120" cy="-140" r="3.5" />
      <circle cx="-80" cy="100" r="4" />
      <circle cx="40" cy="190" r="3.5" />
      <circle cx="200" cy="20" r="4.5" />
      <circle cx="220" cy="-50" r="3.5" />
    </g>
  </g>

  <!-- Top-Right Intense Cyan Ambient Light Burst -->
  <circle cx="1400" cy="160" r="300" fill="#00e5ff" opacity="0.18" filter="url(#glowIntense)" />
  <circle cx="1400" cy="160" r="140" fill="#ffffff" opacity="0.25" filter="url(#glowCyan)" />
</svg>
